name: Refresh north star

on:
  push:
    branches:
      - 'visual-reference/town-style-v1'
    paths:
      - '.tmp/northstar/.ready'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-reference/town-style-v1
      - name: Rebuild north-star JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/northstar/chunk-*.txt | base64 --decode > Docs/art-direction/references/god-mode-town-north-star.jpg
          test -s Docs/art-direction/references/god-mode-town-north-star.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('Docs/art-direction/references/god-mode-town-north-star.jpg')
          b = p.read_bytes()
          assert b[:2] == b'\xff\xd8' and b[-2:] == b'\xff\xd9', 'not a complete JPEG'
          print(f'north-star bytes: {len(b)}')
          PY
      - name: Commit refreshed image
        shell: bash
        run: |
          rm -rf .tmp/northstar
          git config user.name 'god-mode-reference-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Docs/art-direction/references/god-mode-town-north-star.jpg .tmp/northstar
          git commit -m 'fix: restore north-star image from product-owner reference'
          git push origin HEAD:visual-reference/town-style-v1
